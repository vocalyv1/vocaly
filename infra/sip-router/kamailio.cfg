#!KAMAILIO
#
# Vocaly : routeur SIP.
# Airtel livre sur UN numéro Vocaly tous les appels renvoyés (**21*) par les entreprises clientes.
# Le routeur lit le numéro d'origine (en-tête Diversion, sinon History-Info), puis transmet l'appel à ElevenLabs
# en l'adressant à ce numéro. Dans ElevenLabs, le numéro de chaque entreprise est relié à son agent (fait par le site Vocaly).
# Sens inverse : les transferts vers un humain demandés par l'agent passent par ici puis sortent par le trunk Airtel.
#
# Variables d'environnement (fichier .env, voir README) :
#   PUBLIC_IP, AIRTEL_IPS (regex), AIRTEL_HOST, AIRTEL_PORT, AIRTEL_TRANSPORT, VOCALY_NUMBER,
#   EL_HOST, EL_PORT, EL_TRANSPORT, EL_USER, EL_PASSWORD
#
#!defenv PUBLIC_IP

debug=2
log_stderror=yes
fork=yes
children=4
tcp_children=4
auto_aliases=no
listen=udp:0.0.0.0:5060 advertise PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise PUBLIC_IP:5060
tcp_connection_lifetime=3605

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "uac.so"
loadmodule "auth.so"
loadmodule "rtpengine.so"
loadmodule "nathelper.so"

modparam("rr", "append_fromtag", 1)
modparam("uac", "restore_mode", "auto")
modparam("uac", "restore_dlg", 0)
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 60000)

request_route {
	if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }
	if (!sanity_check("17895", "7")) { exit; }

	if (is_method("OPTIONS") && uri==myself) { sl_send_reply("200", "OK"); exit; }

	if (has_totag()) { route(WITHINDLG); exit; }

	if (is_method("CANCEL")) { if (t_check_trans()) { route(RTP); t_relay(); } exit; }
	if (is_method("ACK")) { if (t_check_trans()) t_relay(); exit; }
	t_check_trans();

	if (!is_method("INVITE")) { sl_send_reply("405", "Method Not Allowed"); exit; }

	remove_hf("Route");
	record_route();

	if ($si =~ $env(AIRTEL_IPS)) { route(FROM_AIRTEL); exit; }
	route(FROM_ELEVENLABS);
}

# Appel entrant renvoyé par une entreprise : on retrouve son numéro et on l'envoie à son agent.
route[FROM_AIRTEL] {
	$var(orig) = "";
	if (is_present_hf("Diversion")) {
		$var(orig) = $(di{uri.user});
	} else if (is_present_hf("History-Info")) {
		# La première entrée de History-Info est le numéro appelé à l'origine.
		$var(orig) = $(hdr(History-Info){re.subst,/^[^<]*<sips?:([^@;>]+).*$/\1/});
	}
	$var(num) = "";
	if ($var(orig) != "") { $var(num) = $(var(orig){re.subst,/[^0-9]//g}); }
	# Même règle que le site (src/lib/phone/number.ts) : +242 suivi de 9 chiffres (mobiles 0x…, fixes 22…).
	if ($var(num) =~ "^00") { $var(num) = $(var(num){s.substr,2,0}); }
	if ($var(num) =~ "^242[0-9]{8,9}$") { $var(num) = $(var(num){s.substr,3,0}); }
	if ($var(num) =~ "^[1-9][0-9]{7}$") { $var(num) = "0" + $var(num); }
	if (!($var(num) =~ "^[02][0-9]{8}$")) {
		xlog("L_WARN", "vocaly: numero d'origine absent ou illisible ('$var(orig)') de $fU vers $rU\n");
		sl_send_reply("404", "Original Number Unknown");
		exit;
	}
	$var(num) = "+242" + $var(num);
	if ($var(num) == $env(VOCALY_NUMBER)) {
		xlog("L_WARN", "vocaly: appel direct sur le numero Vocaly sans renvoi, refuse\n");
		sl_send_reply("404", "No Forwarding");
		exit;
	}
	xlog("L_INFO", "vocaly: appel de $fU renvoye par $var(num) -> agent ElevenLabs\n");

	$rU = $var(num);
	$rd = $env(EL_HOST);
	$du = "sip:" + $env(EL_HOST) + ":" + $env(EL_PORT) + ";transport=" + $env(EL_TRANSPORT);
	uac_replace_to("", "sip:" + $var(num) + "@" + $env(EL_HOST));
	remove_hf("Diversion");
	remove_hf("History-Info");
	append_hf("X-Vocaly-Forwarded-By: $var(num)\r\n");
	route(RTP);
	t_on_reply("REPLY");
	if (!t_relay()) sl_reply_error();
}

# Transfert demandé par un agent (appel sortant) : authentification puis sortie par Airtel.
route[FROM_ELEVENLABS] {
	if (!pv_auth_check("$fd", "$env(EL_PASSWORD)", "0", "0")) {
		auth_challenge("$fd", "0");
		exit;
	}
	if ($au != $env(EL_USER)) { sl_send_reply("403", "Forbidden"); exit; }
	consume_credentials();

	$var(num) = $(rU{re.subst,/[^0-9]//g});
	if (!($var(num) =~ "^(242)?0?[0-9]{8,9}$")) {
		xlog("L_WARN", "vocaly: transfert refuse vers $rU (seuls les numeros congolais sont permis)\n");
		sl_send_reply("403", "Destination Not Allowed");
		exit;
	}
	xlog("L_INFO", "vocaly: transfert vers $rU\n");
	$rd = $env(AIRTEL_HOST);
	$du = "sip:" + $env(AIRTEL_HOST) + ":" + $env(AIRTEL_PORT) + ";transport=" + $env(AIRTEL_TRANSPORT);
	uac_replace_from("", "sip:" + $env(VOCALY_NUMBER) + "@" + $env(PUBLIC_IP));
	route(RTP);
	t_on_reply("REPLY");
	if (!t_relay()) sl_reply_error();
}

route[WITHINDLG] {
	if (loose_route()) {
		if (is_method("BYE")) { rtpengine_delete(); }
		else if (is_method("INVITE|UPDATE|ACK") && has_body("application/sdp")) { route(RTP); }
		t_relay();
		exit;
	}
	if (is_method("ACK")) { if (t_check_trans()) t_relay(); exit; }
	sl_send_reply("404", "Not Here");
}

# Le son passe par ce serveur (rtpengine) : Airtel ne voit qu'une seule adresse IP, la nôtre.
route[RTP] {
	if (is_method("CANCEL")) { rtpengine_delete(); return; }
	if (has_body("application/sdp")) {
		rtpengine_manage("replace-origin replace-session-connection ICE=remove RTP/AVP");
	}
}

onreply_route[REPLY] {
	if (has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection ICE=remove RTP/AVP"); }
}
